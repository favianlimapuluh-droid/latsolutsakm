<style>
/* Layout: satu kolom kerja, soal di kiri dan navigator buku besar di kanan; hasil berupa ringkasan skor lalu lembar pembahasan. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --fg: #142230;
  --muted: #566677;
  --line: #D3DAE2;
  --line-strong: #B4BFCB;
  --accent: #1D4E9E;
  --accent-fg: #FFFFFF;
  --accent-soft: #E2EBF8;
  --good: #17714A;
  --good-soft: #E0F2E9;
  --bad: #B02F28;
  --bad-soft: #FBE7E5;
  --warn: #85560A;
  --warn-soft: #FBF0D6;
  --shadow: 0 1px 2px rgba(20,34,48,.06), 0 8px 24px rgba(20,34,48,.05);
  --font-display: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151D; --surface: #16202B; --surface-2: #1B2733; --fg: #E4EBF2; --muted: #92A3B4;
    --line: #273544; --line-strong: #3A4A5B; --accent: #7DAEF0; --accent-fg: #0E151D; --accent-soft: #1D2E45;
    --good: #5CC48C; --good-soft: #15291F; --bad: #F2837B; --bad-soft: #331B1A; --warn: #E3B25A; --warn-soft: #2D2412;
    --shadow: 0 1px 0 rgba(255,255,255,.03);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151D; --surface: #16202B; --surface-2: #1B2733; --fg: #E4EBF2; --muted: #92A3B4;
  --line: #273544; --line-strong: #3A4A5B; --accent: #7DAEF0; --accent-fg: #0E151D; --accent-soft: #1D2E45;
  --good: #5CC48C; --good-soft: #15291F; --bad: #F2837B; --bad-soft: #331B1A; --warn: #E3B25A; --warn-soft: #2D2412;
  --shadow: 0 1px 0 rgba(255,255,255,.03);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.pad {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; min-height: 56px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em;
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 6px; color: var(--accent);
  white-space: nowrap;
}
.brand-text { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { color: var(--muted); font-size: 13px; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 12px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.theme-btn:hover { border-color: var(--line-strong); }
.theme-btn svg { width: 18px; height: 18px; flex: none; }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 56px; }

/* tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  border-radius: 6px; padding: 10px 18px; font-weight: 600; font-size: 15px; border: 1px solid transparent;
  background: var(--accent); color: var(--accent-fg); min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
:focus-visible, .opt:has(input:focus-visible), .nav-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* kartu */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }

/* intro */
.intro { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.intro h1 { font-size: clamp(28px, 5vw, 40px); }
.lede { color: var(--muted); font-size: 17px; max-width: 60ch; }
.ledger { width: 100%; border-collapse: collapse; }
.ledger th, .ledger td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ledger th { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.ledger td.num, .ledger th.num { text-align: right; }
.ledger tr:last-child td { border-bottom: 3px double var(--line-strong); font-weight: 600; }
.ledger .bab { font-family: var(--font-mono); white-space: nowrap; color: var(--accent); font-weight: 500; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.rules li { display: flex; gap: 12px; align-items: baseline; }
.rules .k { font-family: var(--font-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; flex: none; }
.src { color: var(--muted); font-size: 13px; }
.table-scroll { overflow-x: auto; }

/* kuis */
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 24px; align-items: start; }
.q-card { padding: 24px; display: grid; gap: 18px; min-width: 0; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 13px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.blank { background: var(--warn-soft); color: var(--warn); }
.q-no { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
.stem { font-size: 17px; }
.ask { font-size: 17px; font-weight: 600; }
.facts { margin: 0; padding: 12px 16px 12px 34px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 4px; font-size: 15px; }
.opts { display: grid; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
.opt {
  position: relative; display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.opt:hover { border-color: var(--line-strong); background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.letter {
  flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 500; background: var(--surface);
}
.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt-text { padding-top: 2px; min-width: 0; overflow-wrap: anywhere; }
.q-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }

.aside { position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); padding: 18px; display: grid; gap: 16px; }
.prog-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.nav-group { display: grid; gap: 6px; }
.nav-group h3 { font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.nav-cell {
  min-height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums;
}
.nav-cell:hover { border-color: var(--line-strong); }
.nav-cell.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.nav-cell.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.confirm { padding: 28px; display: grid; gap: 16px; }
.confirm .list { display: flex; flex-wrap: wrap; gap: 8px; }
.confirm .row { display: flex; gap: 12px; flex-wrap: wrap; }

/* hasil */
.result { display: grid; gap: 24px; }
.score-card { padding: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
.score { font-family: var(--font-mono); font-size: clamp(48px, 9vw, 72px); font-weight: 500; line-height: 1; letter-spacing: -.02em; }
.score small { font-size: .38em; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.score-meta { display: grid; gap: 6px; min-width: 0; }
.score-meta h2 { font-size: 24px; }
.breakdown { display: grid; gap: 12px; padding: 22px 24px; }
.bd-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 44px; gap: 14px; align-items: center; font-size: 15px; }
.bd-row .val { font-family: var(--font-mono); text-align: right; font-size: 14px; }
.bd-row .bar { height: 10px; }
.bd-row .bar > i { background: var(--good); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 500; min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.review { display: grid; gap: 18px; }
.r-item { padding: 24px; display: grid; gap: 16px; min-width: 0; }
.r-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.r-head .left { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 13px; }
.ropts { display: grid; gap: 8px; }
.ropt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ropt .body { min-width: 0; display: grid; gap: 4px; flex: 1; }
.ropt .note { font-size: 14px; color: var(--muted); }
.ropt .tag { font-size: 12px; font-weight: 600; }
.ropt.is-correct { border-color: var(--good); background: var(--good-soft); }
.ropt.is-correct .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
.ropt.is-correct .tag { color: var(--good); }
.ropt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.ropt.is-wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ropt.is-wrong .tag { color: var(--bad); }
.sol { border-top: 1px dashed var(--line-strong); padding-top: 16px; display: grid; gap: 14px; }
.sol h3 { font-family: var(--font-body); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sol ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
table.calc, table.journal { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.calc td, table.journal td, table.journal th { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.calc td:last-child { text-align: right; font-family: var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.calc tr.total td { font-weight: 600; border-top: 1px solid var(--line-strong); border-bottom: 3px double var(--line-strong); }
table.journal th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
table.journal th.num, table.journal td.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.journal td.cr { padding-left: 32px; }
.jr-title { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.again { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding-top: 8px; }

@media (max-width: 860px) {
  .quiz { grid-template-columns: minmax(0, 1fr); }
  .aside { position: static; }
  .score-card { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .bd-row { grid-template-columns: minmax(0, 1fr) 44px; }
  .bd-row .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 520px) {
  .q-card, .r-item, .confirm, .score-card, .breakdown { padding: 18px; }
  .theme-btn .t-label { display: none; }
  .brand-sub { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .25s ease; }
}
</style>

<script>

};
const Q = [
/* ---------- BAB 9 ---------- */
{

/* ===== STATE ===== */
const KEY = 'akm2-latihan-bab9-12-v2';
const N = Q.length;
let state = { phase: 'intro', idx: 0, answers: Array(N).fill(null), confirm: false, filter: 'all' };

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ phase: state.phase, idx: state.idx, answers: state.answers })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.answers) && s.answers.length === N && (s.phase === 'quiz' || s.phase === 'result')) {
      state.phase = s.phase;
      state.idx = Math.min(Math.max(+s.idx || 0, 0), N - 1);
      state.answers = s.answers.map(a => (a === 0 || a === 1 || a === 2 || a === 3) ? a : null);
    }
  } catch (e) {}
}

const app = document.getElementById('app');
const L = ['A', 'B', 'C', 'D'];
const answered = () => state.answers.filter(a => a !== null).length;
const score = () => Q.reduce((s, q, i) => s + (state.answers[i] === q.correct ? 1 : 0), 0);

function effectiveTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintThemeBtn() {
  const dark = effectiveTheme() === 'dark';
  themeBtn.innerHTML = (dark ? ICON_SUN : ICON_MOON) + '<span class="t-label">' + (dark ? 'Mode terang' : 'Mode gelap') + '</span>';
  themeBtn.setAttribute('aria-label', dark ? 'Ganti ke mode terang' : 'Ganti ke mode gelap');
}
themeBtn.addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('akm2-theme', next); } catch (e) {}
  paintThemeBtn();
});
try {
  const t = localStorage.getItem('akm2-theme');
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

      '</div>' +
    '</section>' +
    '<aside class="card aside" id="aside" aria-label="Navigasi soal">' + navHTML() + '</aside>' +
  '</div>';
}

function renderConfirm() {
  const blanks = state.answers.map((a, i) => a === null ? i : -1).filter(i => i >= 0);
  const a = answered();
  return '<section class="card confirm" style="max-width:640px;margin:0 auto">' +
    '<h2>Kumpulkan jawaban?</h2>' +
    '<p>Terjawab <b class="mono">' + a + ' dari ' + N + '</b> soal. Setelah dikumpulkan, jawaban tidak bisa diubah dan pembahasan terbuka.</p>' +
    (blanks.length ? '<div><p style="margin-bottom:8px;color:var(--muted)">Soal yang masih kosong (dihitung salah):</p><div class="list">' +
      blanks.map(i => '<button type="button" class="nav-cell" style="min-width:44px" data-act="go" data-i="' + i + '">' + (i + 1) + '</button>').join('') + '</div></div>' : '') +
    '<div class="row"><button class="btn ghost" type="button" data-act="back">Kembali mengerjakan</button>' +
    '<button class="btn" type="button" data-act="submit">Kumpulkan dan lihat hasil</button></div>' +
  '</section>';
}

function calcHTML(q) {
  if (!q.calc) return '';
  return '<div><h3>Perhitungan</h3><div class="table-scroll"><table class="calc"><tbody>' +
    q.calc.map(r => '<tr' + (r[2] === 'total' ? ' class="total"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') +
    '</tbody></table></div></div>';
}
function journalHTML(q) {
  if (!q.journal) return '';
  return '<div><h3>Ayat jurnal</h3>' + q.journal.map(j =>
    '<div style="margin-top:8px"><p class="jr-title">' + j.title + '</p><div class="table-scroll"><table class="journal"><thead><tr><th>Akun</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead><tbody>' +
    j.rows.map(r => '<tr><td' + (r[1] === '' ? ' class="cr"' : '') + '>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>').join('') +
    '</tbody></table></div></div>').join('') + '</div>';
}

function reviewItem(q, i) {
  const a = state.answers[i];
  const st = a === null ? 'blank' : (a === q.correct ? 'ok' : 'bad');
  const chip = st === 'ok' ? '<span class="chip ok">Benar</span>' : st === 'bad' ? '<span class="chip bad">Salah</span>' : '<span class="chip blank">Tidak dijawab</span>';
  const opts = q.options.map((t, j) => {
    const isC = j === q.correct, isW = j === a && !isC;
    let tag = '';
    if (isC && a === j) tag = 'Jawabanmu · kunci jawaban';
    else if (isC) tag = 'Kunci jawaban';
    else if (isW) tag = 'Jawabanmu';
    return '<div class="ropt' + (isC ? ' is-correct' : isW ? ' is-wrong' : '') + '"><span class="letter">' + L[j] + '</span><div class="body">' +
      (tag ? '<span class="tag">' + tag + '</span>' : '') + '<span>' + t + '</span>' +
      (!isC && q.wrong && q.wrong[j] ? '<span class="note">Kenapa salah: ' + q.wrong[j] + '</span>' : '') + '</div></div>';
  }).join('');
  return '<article class="card r-item" data-status="' + st + '">' +
    '<div class="r-head"><div class="left"><span class="q-no">Soal ' + (i + 1) + '</span><span class="chip">' + BAB[q.bab].split(' · ')[0] + '</span><span>' + q.ref + '</span></div>' + chip + '</div>' +
    '<p class="stem">' + q.stem + '</p>' + factsHTML(q) + '<p class="ask">' + q.ask + '</p>' +
    '<div class="ropts">' + opts + '</div>' +
    '<div class="sol"><div><h3>Pembahasan</h3><ol>' + q.steps.map(s => '<li>' + s + '</li>').join('') + '</ol></div>' + calcHTML(q) + journalHTML(q) + '</div>' +
  '</article>';
}

function renderResult() {
  const s = score(), pct = Math.round(s / N * 100);
  const verdict = pct >= 85 ? 'Sangat baik' : pct >= 70 ? 'Baik' : pct >= 55 ? 'Cukup' : 'Perlu diulang';
  const blank = N - answered();
  const bd = [9, 10, 11, 12].map(b => {
    const idxs = Q.map((q, i) => q.bab === b ? i : -1).filter(i => i >= 0);
    const ok = idxs.filter(i => state.answers[i] === Q[i].correct).length;
    return '<div class="bd-row"><span>' + BAB[b] + '</span><div class="bar"><i style="width:' + (ok / idxs.length * 100) + '%"></i></div><span class="val">' + ok + '/' + idxs.length + '</span></div>';
  }).join('');
  const wrongN = N - s;
  const f = state.filter;
  const items = Q.map((q, i) => ({ q, i })).filter(o => {
    const ok = state.answers[o.i] === o.q.correct;
    return f === 'all' || (f === 'ok' && ok) || (f === 'bad' && !ok);
  }).map(o => reviewItem(o.q, o.i)).join('');
  return '<div class="result">' +
    '<section class="card score-card"><div class="score" aria-label="Skor ' + s + ' dari ' + N + '">' + s + '<small>/' + N + '</small></div>' +
      '<div class="score-meta"><h2>' + verdict + ' · ' + pct + '%</h2><p style="color:var(--muted)">' + s + ' benar, ' + wrongN + ' salah' + (blank ? ' (' + blank + ' tidak dijawab)' : '') + '. Gulir ke bawah untuk melihat kunci jawaban dan pembahasan tiap soal.</p>' +
      '<div><button class="btn ghost" type="button" data-act="retry">Ulangi latihan</button></div></div></section>' +
    '<section class="card breakdown"><h3 style="font-size:18px">Hasil per bab</h3>' + bd + '</section>' +
    '<div class="filters"><h2 style="font-size:22px">Review soal dan pembahasan</h2>' +
      '<div class="seg" role="group" aria-label="Filter soal">' +
        '<button type="button" data-act="filter" data-f="all" aria-pressed="' + (f === 'all') + '">Semua (' + N + ')</button>' +
        '<button type="button" data-act="filter" data-f="bad" aria-pressed="' + (f === 'bad') + '">Salah (' + wrongN + ')</button>' +
        '<button type="button" data-act="filter" data-f="ok" aria-pressed="' + (f === 'ok') + '">Benar (' + s + ')</button>' +
      '</div></div>' +
    '<div class="review">' + (items || '<p class="card" style="padding:24px;color:var(--muted)">Tidak ada soal pada filter ini.</p>') + '</div>' +
    '<div class="again"><button class="btn" type="button" data-act="retry">Ulangi latihan</button><button class="btn ghost" type="button" data-act="top">Kembali ke atas</button></div>' +
  '</div>';
}

function render() {
  if (state.phase === 'intro') app.innerHTML = renderIntro();
  else if (state.phase === 'quiz') app.innerHTML = state.confirm ? renderConfirm() : renderQuiz();
  else app.innerHTML = renderResult();
}
function toTop() { window.scrollTo({ top: 0 }); }

/* ===== EVENTS ===== */
app.addEventListener('change', e => {
  const r = e.target;
  if (r && r.type === 'radio' && state.phase === 'quiz') {
    state.answers[state.idx] = +r.value;
    save();
    const aside = document.getElementById('aside');
    if (aside) aside.innerHTML = navHTML();
  }
});
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'start') { state.phase = 'quiz'; state.confirm = false; save(); render(); toTop(); }
  else if (act === 'next') { if (state.idx < N - 1) { state.idx++; save(); render(); toTop(); } }
  else if (act === 'prev') { if (state.idx > 0) { state.idx--; save(); render(); toTop(); } }
  else if (act === 'go') { state.idx = +t.dataset.i; state.confirm = false; save(); render(); toTop(); }
  else if (act === 'ask-submit') { state.confirm = true; render(); toTop(); }
  else if (act === 'back') { state.confirm = false; render(); toTop(); }
  else if (act === 'submit') { state.phase = 'result'; state.confirm = false; state.filter = 'all'; save(); render(); toTop(); }
  else if (act === 'filter') { state.filter = t.dataset.f; render(); }
  else if (act === 'retry') { state = { phase: 'quiz', idx: 0, answers: Array(N).fill(null), confirm: false, filter: 'all' }; save(); render(); toTop(); }
  else if (act === 'top') { toTop(); }
});

load();
render();
</script>
